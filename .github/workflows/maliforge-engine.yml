name: MaliForge Engine Android APK

on:
  push:
    branches:
      - engine/maliforge-1.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maliforge-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Build and test C++ engine core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure and build core
        working-directory: MaliForge-Engine-1.0
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run engine tests
        working-directory: MaliForge-Engine-1.0
        run: ctest --test-dir build --output-on-failure

  android-apk:
    name: Build MaliForge Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Decode engine source archive
        run: |
          base64 --decode MaliForge-Engine-1.0-source.tar.gz.b64 > MaliForge-Engine-1.0-source.tar.gz
          tar xzf MaliForge-Engine-1.0-source.tar.gz
      - name: Build debug APK
        working-directory: MaliForge-Engine-1.0
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and package output
        run: |
          set -euo pipefail
          APK="MaliForge-Engine-1.0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK}"
          mkdir -p dist
          cp "${APK}" dist/MaliForge-Engine-1.0.0-debug.apk
          sha256sum dist/MaliForge-Engine-1.0.0-debug.apk | tee dist/SHA256SUMS.txt
          cp MaliForge-Engine-1.0-source.tar.gz dist/MaliForge-Engine-1.0-source.tar.gz
          cat > dist/BUILD_INFO.txt <<INFO
          Engine: MaliForge Engine 1.0.0
          Android package: com.maliforge.engine
          ABIs: armeabi-v7a, arm64-v8a
          GPU API: OpenGL ES 2.0
          Commit: ${GITHUB_SHA}
          INFO
      - name: Upload APK and source bundle
        uses: actions/upload-artifact@v7
        with:
          name: MaliForge-Engine-1.0.0
          path: |
            dist/MaliForge-Engine-1.0.0-debug.apk
            dist/MaliForge-Engine-1.0-source.tar.gz
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30