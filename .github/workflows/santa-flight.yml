name: Santa Flight release
on:
  push:
    branches: [feature/santa-flight-16bit]
    paths:
      - 'santa-flight/**'
      - '.github/workflows/santa-flight.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: santa-flight-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate game script
        run: node --check santa-flight/game.js
      - name: Prepare release package
        run: |
          mkdir -p release
          cp -R santa-flight/. release/
          cd release
          zip -r ../Santa-Flight-16bit.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Santa-Flight-16bit
          path: Santa-Flight-16bit.zip
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
