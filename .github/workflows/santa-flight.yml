name: Santa Flight release
on:
  push:
    branches: [feature/santa-flight-16bit]
    paths:
      - 'santa-flight/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/santa-flight.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: santa-flight-pages
  cancel-in-progress: true
jobs:
  web-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate game script
        run: node --check santa-flight/game.js
      - name: Prepare web package
        run: |
          mkdir -p release
          cp -R santa-flight/. release/
          cd release
          zip -r ../Santa-Flight-16bit-Web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Santa-Flight-16bit-Web
          path: Santa-Flight-16bit-Web.zip
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync game into Android app
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Santa-Flight-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: web-release
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
