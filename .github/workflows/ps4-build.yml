name: Build Tim PS4 PKG

on:
  push:
    branches: [main]
    paths:
      - "native/ps4/**"
      - "native/src/**"
      - "native/tests/**"
      - ".github/workflows/ps4-build.yml"
  pull_request:
    paths:
      - "native/ps4/**"
      - ".github/workflows/ps4-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pkg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test HTTP URL validation on the host
        run: |
          cc -std=c11 -Wall -Wextra -Werror native/src/http_url.c native/tests/test_http_url.c -o /tmp/test_http_url
          /tmp/test_http_url

      - name: Set up Go for the OpenOrbis ELF wrapper
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build upstream create-fself utility
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/create-fself.git /tmp/create-fself
          mkdir -p native/ps4/tools
          cd /tmp/create-fself/cmd/create-fself
          go build -modfile=go-linux.mod -o "$GITHUB_WORKSPACE/native/ps4/tools/create-fself" .

      - name: Build upstream create-gp4 utility
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/create-gp4.git /tmp/create-gp4
          cd /tmp/create-gp4/cmd/create-gp4
          go build -o "$GITHUB_WORKSPACE/native/ps4/tools/create-gp4" .

      - name: Generate package icon on the GitHub runner
        run: python3 native/ps4/scripts/make_icon.py native/ps4/sce_sys/icon0.png

      - name: Build with official OpenOrbis toolchain container
        run: |
          docker run --rm --user 0 \
            -v "$PWD:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -lc 'cd native/ps4 && make clean all'

      - name: Verify package artifact exists
        run: test -s native/ps4/IV0000-TIMA00001_00-TIMCLIENT0000001.pkg

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: Tim-PS4-PKG
          path: native/ps4/IV0000-TIMA00001_00-TIMCLIENT0000001.pkg
          if-no-files-found: error
