name: Build Tim PS4 PKG

on:
  push:
    branches: [main, feature/native-http-downloader]
    paths:
      - "native/ps4/**"
      - "native/src/**"
      - "native/tests/**"
      - ".github/workflows/ps4-build.yml"
  pull_request:
    paths:
      - "native/ps4/**"
      - "native/src/**"
      - "native/tests/**"
      - ".github/workflows/ps4-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pkg:
    runs-on: ubuntu-latest
    container:
      image: xfangfang/pacbrew:250221
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test HTTP URL validation on the host
        run: |
          cc -std=c11 -Wall -Wextra -Werror native/src/http_url.c native/tests/test_http_url.c -o /tmp/test_http_url
          /tmp/test_http_url

      - name: Set up Go for the OpenOrbis ELF wrapper
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build upstream create-fself utility
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/create-fself.git /tmp/create-fself
          mkdir -p native/ps4/tools
          cd /tmp/create-fself/cmd/create-fself
          go build -modfile=go-linux.mod -o "$GITHUB_WORKSPACE/native/ps4/tools/create-fself" .

      - name: Build upstream create-gp4 utility
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/create-gp4.git /tmp/create-gp4
          cd /tmp/create-gp4/cmd/create-gp4
          go build -o "$GITHUB_WORKSPACE/native/ps4/tools/create-gp4" .

      - name: Generate package icon on the GitHub runner
        run: python3 native/ps4/scripts/make_icon.py native/ps4/sce_sys/icon0.png

      - name: Install PS4 libtorrent dependencies
        env:
          DEPS_URL: https://github.com/thcolin/gamepad-media-center-aggregator/releases/download/ci-deps
          TORRENT_DEPS_URL: https://github.com/amansingh909/gamepad-media-center-aggregator/releases/download/ci-deps
        run: |
          set -eu
          for dep in "boost-headers-1.83.0-1 a3ae84500b4b9d28cef9a2af324f8760d6f97aaba0faf2840e8e3760b2519166" \
                     "libtorrent-2.0.15-1 052600d00ab7af897e0fca43b03464086e9a7f0b7a80f60ef4d2221ed3443dfd"; do
            set -- $dep
            curl -fsSLo /tmp/$1.pkg.tar.gz "$TORRENT_DEPS_URL/ps4-openorbis-$1-any.pkg.tar.gz"
            echo "$2  /tmp/$1.pkg.tar.gz" | sha256sum -c -
            pacman --noconfirm -U /tmp/$1.pkg.tar.gz
          done
          git config --global --add safe.directory '*'

      - name: Build with OpenOrbis toolchain
        env:
          OO_PS4_TOOLCHAIN: /opt/pacbrew/ps4/openorbis
        run: |
          set -eu
          grep -nE "sceNetInit|sceHttpInit|sceHttpCreateTemplate|sceHttpCreateConnectionWithURL|sceHttpCreateRequestWithURL|sceHttpSendRequest|sceHttpGetStatusCode|sceHttpGetResponseContentLength|sceHttpReadData|sceSslInit|sceHttpDeleteTemplate|sceHttpTerm" /opt/pacbrew/ps4/openorbis/include/orbis/{Net.h,Http.h,Ssl.h}
          cd native/ps4
          make clean all

      - name: Verify package artifact exists
        run: test -s native/ps4/IV0000-TIMA00001_00-TIMCLIENT0000001.pkg

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: Tim-PS4-PKG
          path: native/ps4/IV0000-TIMA00001_00-TIMCLIENT0000001.pkg
          if-no-files-found: error
