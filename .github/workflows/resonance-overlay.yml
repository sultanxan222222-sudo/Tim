name: Resonance overlay compatibility

on:
  push:
    paths:
      - "dreamcast/mini-dlss/**"
      - "dreamcast/patches/**"
      - "scripts/integrate-resonance-whats-next.py"
      - ".github/workflows/resonance-overlay.yml"
  pull_request:
    paths:
      - "dreamcast/mini-dlss/**"
      - "dreamcast/patches/**"
      - "scripts/integrate-resonance-whats-next.py"
      - ".github/workflows/resonance-overlay.yml"
  workflow_dispatch:

jobs:
  apply-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact Flycast base pinned by Resonance
        run: |
          git clone --filter=blob:none https://github.com/flyinghead/flycast.git /tmp/flycast
          git -C /tmp/flycast checkout 0d9853df9
          git clone --depth 1 https://github.com/iHaiDeeZ/Resonance.git /tmp/resonance
      - name: Apply Resonance PS4 patch
        run: git -C /tmp/flycast apply /tmp/resonance/patches/flycast-ps4.patch
      - name: Integrate WHAT'S NEXT into renderer
        run: python3 scripts/integrate-resonance-whats-next.py /tmp/flycast
      - name: Verify integration sources and registration
        run: |
          test -f /tmp/flycast/core/rend/vulkan/whats_next/src/frame_generation_bridge.cpp
          grep -q 'whats_next/src/frame_generation_bridge.cpp' /tmp/flycast/core/rend/vulkan/CMakeLists.txt
          grep -q 'whatsNextBridge.begin_real_frame' /tmp/flycast/core/rend/vulkan/vulkan_context.cpp
          grep -q 'Mini-DLSS spatial finishing pass' /tmp/flycast/core/rend/vulkan/frame_gen.cpp
          grep -q 'vec3 lo = min(base' /tmp/flycast/core/rend/vulkan/frame_gen.cpp
          grep -q 'vec3 hi = max(base' /tmp/flycast/core/rend/vulkan/frame_gen.cpp
          test -f /tmp/flycast/core/rend/vulkan/whats_next/shaders/mini_dlss_upscale.comp
      - name: Compile modified interpolation fragment shader
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/flycast/core/rend/vulkan/frame_gen.cpp').read_text()
          marker = 'const char *const kFragment = R"('
          start = source.index(marker) + len(marker)
          end = source.index(')";', start)
          Path('/tmp/mini_dlss_framegen.frag').write_text(source[start:end])
          PY
          glslangValidator -V -S frag /tmp/mini_dlss_framegen.frag -o /tmp/mini_dlss_framegen.spv
