name: Resonance overlay compatibility

on:
  push:
    paths:
      - "dreamcast/mini-dlss/**"
      - "dreamcast/patches/**"
      - "scripts/integrate-resonance-whats-next.py"
      - ".github/workflows/resonance-overlay.yml"
  pull_request:
    paths:
      - "dreamcast/mini-dlss/**"
      - "dreamcast/patches/**"
      - "scripts/integrate-resonance-whats-next.py"
      - ".github/workflows/resonance-overlay.yml"
  workflow_dispatch:

jobs:
  apply-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact Flycast base pinned by Resonance
        run: |
          git clone --filter=blob:none https://github.com/flyinghead/flycast.git /tmp/flycast
          git -C /tmp/flycast checkout 0d9853df9
          git clone --depth 1 https://github.com/iHaiDeeZ/Resonance.git /tmp/resonance
      - name: Apply Resonance PS4 patch
        run: git -C /tmp/flycast apply /tmp/resonance/patches/flycast-ps4.patch
      - name: Integrate WHAT'S NEXT into renderer
        run: python3 scripts/integrate-resonance-whats-next.py /tmp/flycast
      - name: Verify integration sources and registration
        run: |
          test -f /tmp/flycast/core/rend/vulkan/whats_next/src/frame_generation_bridge.cpp
          grep -q 'whats_next/src/frame_generation_bridge.cpp' /tmp/flycast/core/rend/vulkan/CMakeLists.txt
          test -f /tmp/flycast/core/rend/vulkan/whats_next/src/resonance_frame_adapter.cpp
          grep -q 'whats_next/src/resonance_frame_adapter.cpp' /tmp/flycast/core/rend/vulkan/CMakeLists.txt
          grep -q 'whatsNextBridge.begin_real_frame' /tmp/flycast/core/rend/vulkan/vulkan_context.cpp
          grep -q 'Mini-DLSS spatial finishing pass' /tmp/flycast/core/rend/vulkan/frame_gen.cpp
          grep -q 'considerMotionCandidate' /tmp/flycast/core/rend/vulkan/frame_gen.cpp
          grep -q 'textureConfidence' /tmp/flycast/core/rend/vulkan/frame_gen.cpp
          grep -q 'disocclusionReject' /tmp/flycast/core/rend/vulkan/frame_gen.cpp
          grep -q 'vec4(bestM, best, confidence)' /tmp/flycast/core/rend/vulkan/frame_gen.cpp
          grep -q 'vec3 lo = min(base' /tmp/flycast/core/rend/vulkan/frame_gen.cpp
          grep -q 'vec3 hi = max(base' /tmp/flycast/core/rend/vulkan/frame_gen.cpp
          grep -q 'quadMiniDlssDrawer->Draw' /tmp/flycast/core/rend/vulkan/vulkan_context.cpp
          grep -q 'quadRotateMiniDlssDrawer->Draw' /tmp/flycast/core/rend/vulkan/vulkan_context.cpp
          grep -q '++fgResourceGeneration' /tmp/flycast/core/rend/vulkan/vulkan_context.cpp
          grep -q 'fgPrevExtent = vk::Extent2D()' /tmp/flycast/core/rend/vulkan/vulkan_context.cpp
          grep -q 'MINI_DLSS' /tmp/flycast/core/rend/vulkan/shaders.cpp
          grep -q 'quadMiniDlssFragmentShader' /tmp/flycast/core/rend/vulkan/shaders.h
          grep -Fq "Генерация промежуточных кадров" /tmp/flycast/shell/ps4/launcher/settings_menu.cpp
          grep -Fq "Мини-DLSS — повышение чёткости" /tmp/flycast/shell/ps4/launcher/settings_menu.cpp
          grep -q 'config::FrameGeneration' /tmp/flycast/shell/ps4/launcher/settings_menu.cpp
          grep -q 'config::MiniDLSS' /tmp/flycast/shell/ps4/launcher/settings_menu.cpp
          python3 - <<'PY'
          from pathlib import Path
          context = Path('/tmp/flycast/core/rend/vulkan/vulkan_context.cpp').read_text()
          header = Path('/tmp/flycast/core/rend/vulkan/vulkan_context.h').read_text()
          accepted = ("if (EndFrame(overlayCmdBuffer))\n"
                      "\t\t\t\twhatsNextBridge.commit_real_frame();\n"
                      "\t\t\telse\n"
                      "\t\t\t\twhatsNextBridge.abort_real_frame();")
          aborted = "} catch (const InvalidVulkanContext&) {\n\t\t\twhatsNextBridge.abort_real_frame();"
          signature = 'bool VulkanContext::EndFrame(vk::CommandBuffer overlayCmdBuffer)'
          if accepted not in context:
              raise SystemExit('source-frame history must branch on EndFrame submission success')
          if signature not in context or 'return false;' not in context or 'return true;' not in context:
              raise SystemExit('EndFrame must return an explicit submission-success boolean')
          if 'bool EndFrame(vk::CommandBuffer cmdBuffer = vk::CommandBuffer());' not in header:
              raise SystemExit('EndFrame declaration must use the boolean submission result')
          if aborted not in context:
              raise SystemExit('abandoned PresentFrame must abort its pending source-frame transaction')
          PY
          git -C /tmp/flycast diff --check
          test -f /tmp/flycast/core/rend/vulkan/whats_next/shaders/mini_dlss_upscale.comp
          test -f /tmp/flycast/core/rend/vulkan/whats_next/src/render_budget_controller.cpp
          test -f /tmp/flycast/core/rend/vulkan/whats_next/src/gpu_timestamp_math.cpp
          grep -q 'gpu_timestamp_math.cpp' /tmp/flycast/core/rend/vulkan/CMakeLists.txt
          grep -q 'vk::PipelineStageFlagBits::eTopOfPipe' /tmp/flycast/core/rend/vulkan/vulkan_context.cpp
          grep -q 'vk::PipelineStageFlagBits::eBottomOfPipe' /tmp/flycast/core/rend/vulkan/vulkan_context.cpp
          grep -q 'GetLastGpuFrameTimeMs' /tmp/flycast/core/rend/vulkan/vulkan_context.h
          for symbol in vkCreateQueryPool vkDestroyQueryPool vkGetQueryPoolResults vkCmdResetQueryPool vkCmdWriteTimestamp; do
            grep -q "$symbol" /tmp/flycast/core/deps/libretro-common/vulkan/vulkan_symbol_wrapper.c
            grep -q "$symbol" /tmp/flycast/core/deps/libretro-common/include/vulkan/vulkan_symbol_wrapper.h
          done
          grep -q 'render_budget_controller.cpp' /tmp/flycast/core/rend/vulkan/CMakeLists.txt
      - name: Compile WHAT'S NEXT renderer bridge sources
        run: |
          for source in history_gate frame_generation_policy frame_generation_controller frame_generation_bridge resonance_frame_adapter render_budget_controller gpu_timestamp_math; do
            g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
              -I /tmp/flycast/core/rend/vulkan/whats_next/include \
              -fsyntax-only "/tmp/flycast/core/rend/vulkan/whats_next/src/${source}.cpp"
          done
      - name: Compile Mini-DLSS ordinary-frame fragment shader
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/flycast/core/rend/vulkan/shaders.cpp').read_text()
          marker = 'static const char QuadFragmentShaderSource[] = R"('
          start = source.index(marker) + len(marker)
          end = source.index(')";', start)
          body = source[start:end]
          Path('/tmp/mini_dlss_quad.frag').write_text(
              '#version 450\n#define IGNORE_TEX_ALPHA 1\n#define MINI_DLSS 1\n' + body
          )
          PY
          glslangValidator -V -S frag /tmp/mini_dlss_quad.frag -o /tmp/mini_dlss_quad.spv
      - name: Compile modified fine-motion compute shader
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('/tmp/flycast/core/rend/vulkan/frame_gen.cpp').read_text()
          def raw_shader(name):
              pattern = r'const char \*const ' + re.escape(name) + r' = R"\((.*?)\n\)";'
              match = re.search(pattern, source, re.S)
              if not match:
                  raise SystemExit(f"missing shader constant: {name}")
              return match.group(1)
          Path('/tmp/mini_dlss_framegen_fine.comp').write_text(
              raw_shader('kCommon') + '\n' + raw_shader('kFine') + '\n'
          )
          PY
          glslangValidator -V -S comp /tmp/mini_dlss_framegen_fine.comp -o /tmp/mini_dlss_framegen_fine.spv

      - name: Compile modified interpolation fragment shader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/flycast/core/rend/vulkan/frame_gen.cpp').read_text()
          marker = 'const char *const kFragment = R"('
          start = source.index(marker) + len(marker)
          end = source.index(')";', start)
          Path('/tmp/mini_dlss_framegen.frag').write_text(source[start:end])
          PY
          glslangValidator -V -S frag /tmp/mini_dlss_framegen.frag -o /tmp/mini_dlss_framegen.spv

      - name: Run host tests for adaptive render budget policy
        run: |
          cmake -S dreamcast/mini-dlss -B /tmp/mini-dlss-host-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/mini-dlss-host-build --parallel 2
          ctest --test-dir /tmp/mini-dlss-host-build --output-on-failure
