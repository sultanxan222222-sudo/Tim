name: Validate PS4 catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate catalog JSON
        run: python -m json.tool catalog.json > /dev/null

      - name: Verify required files
        run: test -s index.html && test -s catalog.json

      - name: Upload catalog prototype
        uses: actions/upload-artifact@v4
        with:
          name: tim-catalog-prototype
          path: |
            index.html
            catalog.json
          if-no-files-found: error
