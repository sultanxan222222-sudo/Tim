name: MaliForge Dreamcast Android emulator APK

on:
  push:
    branches:
      - build/flycast-mali-android
      - engine/maliforge-flycast-emulator
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flycast-mali-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Build patched Flycast APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FLYCAST_COMMIT: 72b8e67141d85ca5c9259f04563b49f7f92f928b
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v7

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libcurl4-openssl-dev

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore C++ compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: flycast-mali-android-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            flycast-mali-android-${{ runner.os }}-

      - name: Fetch pinned Flycast source and submodules
        run: |
          mkdir flycast
          git -C flycast init
          git -C flycast remote add origin https://github.com/flyinghead/flycast.git
          git -C flycast fetch --depth=1 origin "${FLYCAST_COMMIT}"
          git -C flycast checkout --detach FETCH_HEAD
          git -C flycast submodule update --init --recursive --depth 1
          test "$(git -C flycast rev-parse HEAD)" = "${FLYCAST_COMMIT}"

      - name: Check and apply GLES2 compatibility patch
        run: |
          python3 scripts/apply_patch.py flycast
          git -C flycast diff --check

      - name: Integrate MaliForge into the Flycast GLES renderer
        run: |
          python3 scripts/integrate-maliforge.py flycast
          git -C flycast diff --check

      - name: Validate patch contract
        run: python3 -m unittest discover -s tests -v

      - name: Build Android debug APK
        working-directory: flycast/shell/android-studio
        run: |
          chmod +x ./gradlew
          ./gradlew :flycast:assembleDebug --no-daemon --parallel --stacktrace

      - name: Verify and package APK
        run: |
          set -euo pipefail
          APK="$(find flycast/shell/android-studio/flycast/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "${APK}"
          test -s "${APK}"
          mkdir -p dist
          cp "${APK}" dist/MaliForge-Dreamcast-Android-debug.apk
          sha256sum dist/MaliForge-Dreamcast-Android-debug.apk | tee dist/SHA256SUMS.txt
          {
            echo "Flycast emulation core: ${FLYCAST_COMMIT}"
            echo "MaliForge graphics stage: GLES2 edge-adaptive final-frame compositor (Mali GPUs)"
            echo "Patched build: ${GITHUB_SHA}"
            echo "APK size: $(stat -c '%s' dist/MaliForge-Dreamcast-Android-debug.apk) bytes"
          } | tee dist/BUILD_INFO.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: MaliForge-Dreamcast-Android-debug-apk
          path: |
            dist/Flycast-Mali-TV-debug.apk
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
