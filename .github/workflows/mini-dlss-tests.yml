name: Mini-DLSS host tests

on:
  push:
    paths:
      - "dreamcast/mini-dlss/**"
      - ".github/workflows/mini-dlss-tests.yml"
  pull_request:
    paths:
      - "dreamcast/mini-dlss/**"
      - ".github/workflows/mini-dlss-tests.yml"
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S dreamcast/mini-dlss -B build/mini-dlss -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/mini-dlss --parallel 2
      - name: Run tests
        run: ctest --test-dir build/mini-dlss --output-on-failure

  sanitizer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: cmake -S dreamcast/mini-dlss -B build/mini-dlss-sanitize -DCMAKE_BUILD_TYPE=Debug -DWHATS_NEXT_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build/mini-dlss-sanitize --parallel 2
      - name: Run sanitized tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/mini-dlss-sanitize --output-on-failure

  shader-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GLSL compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
      - name: Compile compute shaders to SPIR-V
        run: |
          glslangValidator -V -S comp dreamcast/mini-dlss/shaders/edge_aware_sharpen.comp -o /tmp/edge_aware_sharpen.spv
          glslangValidator -V -S comp dreamcast/mini-dlss/shaders/mini_dlss_upscale.comp -o /tmp/mini_dlss_upscale.spv
