name: PS4-Xplorer RU static checks

on:
  push:
    branches:
      - ps4-xplorer-russian
  pull_request:
    branches:
      - main
      - ps4-xplorer-russian
  workflow_dispatch:

jobs:
  localization-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check patcher syntax
        run: python -m py_compile file-manager/PS4-Xplorer-RU/apply_russian_patch.py
      - name: Validate JSON manifests
        run: python -c "import json; json.load(open('file-manager/PS4-Xplorer-RU/ru-RU.json', encoding='utf-8')); json.load(open('file-manager/PS4-Xplorer-RU/PATCH-MANIFEST.json', encoding='utf-8'))"
      - name: Validate Russian localization files
        run: python file-manager/PS4-Xplorer-RU/tests/check_localization.py
      - name: Test patcher with temporary fixtures
        run: python file-manager/PS4-Xplorer-RU/tests/test_patch_script.py
      - name: Check patch artifact validator syntax
        run: python -m py_compile file-manager/PS4-Xplorer-RU/tests/validate_exported_patch.py
