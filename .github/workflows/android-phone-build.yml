name: Android Phone Dreamcast GLES3 + Vulkan

on:
  push:
    branches: [android-tv-dreamcast]
    paths:
      - ".github/workflows/android-phone-build.yml"
      - ".gitmodules"
      - "third_party/flycast"
      - "android-tv/**"
  pull_request:
    branches: [android-tv-dreamcast]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flycast-android-phone:
    name: Build Android phone APK (GLES3 + Vulkan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository and pinned Flycast submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install pinned Android build components
        run: |
          sdkmanager "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Apply Russian shell and phone graphics backend
        run: python3 android-tv/apply-phone-shell.py

      - name: Build installable debug APK
        working-directory: third_party/flycast/shell/android-studio
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :flycast:assembleDebug

      - name: Inspect APK output
        run: |
          APK=$(find third_party/flycast/shell/android-studio/flycast/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload installable phone APK
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-android-phone-gles3-vulkan-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
