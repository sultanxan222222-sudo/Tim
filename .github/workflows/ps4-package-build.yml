name: Build PS4 Dreamcast package

on:
  push:
    paths:
      - ".github/workflows/ps4-package-build.yml"
      - "scripts/build-ps4-emulator.sh"
      - "scripts/integrate-resonance-whats-next.py"
      - "dreamcast/mini-dlss/**"
      - "dreamcast/patches/**"
  workflow_dispatch:
    inputs:
      version:
        description: "PS4 package version (use XX.YY; default 01.42)"
        required: false
        default: "01.42"
        type: string

permissions:
  contents: read

jobs:
  build-pkg:
    name: Build Resonance + WHAT'S NEXT + Mini-DLSS
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENORBIS: /opt/pacbrew/ps4/openorbis
      DOLPHIN_PS4_SOURCE: ${{ runner.temp }}/DolphinPS4
      CRM: /home/runner/dolphinps4-build
      RESONANCE_DIR: /home/runner/resonance
      PS4_BUILD_ROOT: /home/runner/resonance-build
      RESONANCE_VERSION: ${{ inputs.version || '01.42' }}
      JOBS: "3"

    steps:
      - name: Check out WHAT'S NEXT
        uses: actions/checkout@v4

      - name: Free space and install build prerequisites
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/lib/heroku
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git curl wget pkg-config \
            autoconf automake libtool nasm bison flex \
            python3 python3-dev python3-pip python3-venv python3-setuptools python3-pil \
            libarchive-tools pacman-package-manager makepkg \
            glslang-tools
          df -h /

      - name: Install LLVM 21
        shell: bash
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          chmod +x "$RUNNER_TEMP/llvm.sh"
          sudo "$RUNNER_TEMP/llvm.sh" 21
          sudo apt-get install -y llvm-21 llvm-21-tools
          clang-21 --version
          clang++-21 --version
          ld.lld-21 --version
          llvm-ar-21 --version
          llvm-ranlib-21 --version

      - name: Install PacBrew OpenOrbis PS4 toolchain
        shell: bash
        run: |
          printf '\n[pacbrew]\nSigLevel = Optional TrustAll\nServer = https://pacman.mydedibox.fr/pacbrew/packages/\n' | sudo tee -a /etc/pacman.conf
          sudo pacman -Sy --noconfirm
          sudo pacman -S --noconfirm ps4-openorbis ps4-openorbis-portlibs
          test -f "$OPENORBIS/ps4vars.sh"
          test -f "$OPENORBIS/bin/linux/PkgTool.Core"
          test -f "$OPENORBIS/bin/linux/create-gp4"
          test -d "$OPENORBIS/samples/piglet/sce_module"
          find "$OPENORBIS/samples/piglet/sce_module" -maxdepth 1 -type f -printf '%f\n' | head

      - name: Install .NET runtimes for package tools
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Fetch public DolphinPS4 toolchain sources
        shell: bash
        run: |
          git clone https://github.com/iHaiDeeZ/DolphinPS4.git "$DOLPHIN_PS4_SOURCE"
          git -C "$DOLPHIN_PS4_SOURCE" checkout b5221e6dd36391042a232957eeb61f210b7cd51f
          mkdir -p "$CRM/src" "$CRM/host-compat" "$CRM/logs"

      - name: Build PS4 libc++ and runtime
        shell: bash
        run: |
          export PSB="$CRM"
          bash "$DOLPHIN_PS4_SOURCE/toolchain/build-libcxx.sh" 2>&1 | tee "$CRM/logs/build-libcxx.log"
          bash "$DOLPHIN_PS4_SOURCE/toolchain/build-runtime.sh" 2>&1 | tee "$CRM/logs/build-runtime.log"
          test -s "$CRM/sysroot/lib/libc++.a"
          test -s "$CRM/sysroot/lib/libc++abi.a"
          test -s "$CRM/sysroot/lib/libdolphinps4_rt.a"

      - name: Fetch pinned Mesa and libdrm sources
        shell: bash
        run: |
          git ls-remote --exit-code --tags https://gitlab.freedesktop.org/mesa/mesa.git refs/tags/mesa-26.0.8
          git ls-remote --exit-code --tags https://gitlab.freedesktop.org/mesa/drm.git refs/tags/libdrm-2.4.125
          git clone --depth 1 --branch mesa-26.0.8 https://gitlab.freedesktop.org/mesa/mesa.git "$CRM/src/mesa"
          git -C "$CRM/src/mesa" apply "$DOLPHIN_PS4_SOURCE/patches/mesa-ps4.patch"
          git clone --depth 1 --branch libdrm-2.4.125 https://gitlab.freedesktop.org/mesa/drm.git "$CRM/src/libdrm"

      - name: Build PS4 RADV Vulkan driver
        shell: bash
        run: |
          python3 -m venv "$CRM/mesa-venv"
          "$CRM/mesa-venv/bin/pip" install --upgrade pip meson mako pyyaml
          PS4_BUILD_ROOT="$CRM" OPENORBIS="$OPENORBIS" JOBS="$JOBS" \
            bash "$DOLPHIN_PS4_SOURCE/scripts/build-mesa.sh" setup 2>&1 | tee "$CRM/logs/build-mesa.log"
          test -s "$CRM/build/mesa/src/amd/vulkan/libvulkan_radeon.a"
          find "$CRM/build/mesa" -name '*.a' | wc -l

      - name: Check out Resonance PS4 app
        shell: bash
        run: |
          git clone https://github.com/iHaiDeeZ/Resonance.git "$RESONANCE_DIR"
          git -C "$RESONANCE_DIR" rev-parse --short HEAD
          test -f "$RESONANCE_DIR/patches/flycast-ps4.patch"
          test -f "$RESONANCE_DIR/patches/BASE.txt"

      - name: Build and package the integrated emulator
        shell: bash
        run: |
          bash -n scripts/build-ps4-emulator.sh scripts/apply-resonance-whats-next.sh
          python3 -m py_compile scripts/integrate-resonance-whats-next.py
          CRM="$CRM" OPENORBIS="$OPENORBIS" \
            RESONANCE_DIR="$RESONANCE_DIR" PS4_BUILD_ROOT="$PS4_BUILD_ROOT" \
            RESONANCE_VERSION="$RESONANCE_VERSION" JOBS="$JOBS" \
            bash scripts/build-ps4-emulator.sh 2>&1 | tee "$RUNNER_TEMP/ps4-package-build.log"
          mkdir -p "$RUNNER_TEMP/package"
          cp "$RESONANCE_DIR/out/Resonance-v$RESONANCE_VERSION.pkg" "$RUNNER_TEMP/package/"
          cp "$RESONANCE_DIR/out/Resonance-v$RESONANCE_VERSION-update.tar" "$RUNNER_TEMP/package/"

      - name: Upload installable PKG and update archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-v${{ inputs.version || '01.42' }}-PS4-PKG
          path: ${{ runner.temp }}/package/*
          if-no-files-found: error
          retention-days: 14

      - name: Collect logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ps4-build-logs"
          for file in "$RUNNER_TEMP/ps4-package-build.log" "$CRM/logs" "$CRM/build/mesa/meson-logs"; do
            if [ -f "$file" ]; then
              cp "$file" "$RUNNER_TEMP/ps4-build-logs/"
            elif [ -d "$file" ]; then
              cp -a "$file" "$RUNNER_TEMP/ps4-build-logs/$(basename "$file")"
            fi
          done

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ps4-build-diagnostics
          path: ${{ runner.temp }}/ps4-build-logs
          if-no-files-found: warn
          retention-days: 7
