name: Native queue tests

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-tests.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install C compiler and make
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Compile with warnings as errors and run tests
        working-directory: native
        run: make test
